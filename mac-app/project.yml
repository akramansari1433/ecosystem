name: Ecosystem
options:
  bundleIdPrefix: com.akram
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  Ecosystem:
    type: application
    platform: macOS
    sources:
      - Ecosystem
    info:
      path: Ecosystem/Info.plist
      properties:
        CFBundleDisplayName: Ecosystem
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSLocalNetworkUsageDescription: >-
          Ecosystem discovers and connects to your Android phone on the local network.
        NSBonjourServices:
          - _ecosys._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akram.ecosystem
        ENABLE_HARDENED_RUNTIME: false

schemes:
  Ecosystem:
    build:
      targets:
        Ecosystem: all
